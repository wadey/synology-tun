name: Build and Push Docker Image

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    # Run nightly at 03:23 UTC
    - cron: "23 3 * * *"
  workflow_dispatch:

env:
  IMAGE_NAME: wadey/synology-tun
  BASE_IMAGE_REPO: docker.io/library/busybox
  BASE_IMAGE_TAG: latest

jobs:
  check:
    name: Check for updates
    runs-on: ubuntu-latest
    permissions:
      packages: read
    outputs:
      should_build: ${{ steps.compare.outputs.should_build }}
      base_digest: ${{ steps.compare.outputs.base_digest }}

    steps:
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'schedule'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check base image digest
        id: compare
        run: |
          set -euo pipefail

          # Resolve the multi-arch manifest list digest of the upstream base image
          MANIFEST_TMP=$(mktemp)
          skopeo inspect --raw "docker://${BASE_IMAGE_REPO}:${BASE_IMAGE_TAG}" > "$MANIFEST_TMP"
          UPSTREAM_BASE_DIGEST="sha256:$(sha256sum "$MANIFEST_TMP" | awk '{print $1}')"
          rm -f "$MANIFEST_TMP"
          echo "Upstream ${BASE_IMAGE_REPO}:${BASE_IMAGE_TAG} index digest: ${UPSTREAM_BASE_DIGEST}"
          echo "base_digest=${UPSTREAM_BASE_DIGEST}" >> "$GITHUB_OUTPUT"

          NEEDS_BUILD=false
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Event is '${{ github.event_name }}'; forcing build."
            NEEDS_BUILD=true
          else
            for ARCH in amd64 arm64; do
              INSPECT_JSON=$(skopeo inspect --override-os linux --override-arch "${ARCH}" \
                --authfile "${HOME}/.docker/config.json" \
                "docker://ghcr.io/${IMAGE_NAME}:latest" 2>/dev/null || echo "{}")

              BUILT_BASE=$(jq -r '.Labels["org.opencontainers.image.base.digest"] // ""' <<< "$INSPECT_JSON")
              echo "[${ARCH}] built base: ${BUILT_BASE:-<none>}"

              if [ "$UPSTREAM_BASE_DIGEST" != "$BUILT_BASE" ]; then
                echo "-> [${ARCH}] Base image digest changed or arch missing."
                NEEDS_BUILD=true
              fi
            done

            if [ "$NEEDS_BUILD" = "false" ]; then
              echo "Up to date on all architectures; skipping build."
            fi
          fi

          echo "should_build=${NEEDS_BUILD}" >> "$GITHUB_OUTPUT"

  build:
    name: Build and push image
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build local image for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          platforms: linux/amd64
          load: true
          tags: synology-tun:test
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE_REPO }}@${{ needs.check.outputs.base_digest }}

      - name: Test image
        run: |
          set -euo pipefail

          if grep -q '^tun ' /proc/modules; then
            echo "ERROR: 'tun' module is already loaded in /proc/modules on the runner; cannot test insmod path" >&2
            exit 1
          fi

          TEST_DIR=$(mktemp -d)
          FIXTURE_DIR=$(mktemp -d)
          EMPTY_MODS_DIR=$(mktemp -d)
          LOADED_MOD=""
          cleanup() {
            if [ -n "$LOADED_MOD" ]; then
              sudo rmmod "$LOADED_MOD" 2>/dev/null || true
            fi
            rm -rf "$TEST_DIR" "$FIXTURE_DIR" "$EMPTY_MODS_DIR"
          }
          trap cleanup EXIT

          echo "=== Test 1: missing tun.ko ==="
          set +e
          OUTPUT=$(docker run --rm --cap-add CAP_SYS_MODULE --network none \
            -v "${TEST_DIR}:/lib/modules:ro" \
            synology-tun:test 2>&1)
          STATUS=$?
          set -e
          echo "Exit status: ${STATUS}"
          echo "Output: ${OUTPUT}"

          if [ "$STATUS" -eq 0 ]; then
            echo "ERROR: Expected non-zero exit status when /lib/modules/tun.ko is missing" >&2
            exit 1
          fi
          if ! grep -qi "insmod:.*No such file or directory" <<< "$OUTPUT"; then
            echo "ERROR: Expected insmod 'No such file or directory' error" >&2
            exit 1
          fi

          echo "=== Test 2: dummy tun.ko ==="
          printf 'not a kernel module\n' > "${TEST_DIR}/tun.ko"
          set +e
          OUTPUT=$(docker run --rm --cap-add CAP_SYS_MODULE --network none \
            -v "${TEST_DIR}:/lib/modules:ro" \
            synology-tun:test 2>&1)
          STATUS=$?
          set -e
          echo "Exit status: ${STATUS}"
          echo "Output: ${OUTPUT}"

          if [ "$STATUS" -eq 0 ]; then
            echo "ERROR: Expected non-zero exit status for dummy /lib/modules/tun.ko" >&2
            exit 1
          fi
          if ! grep -qi "insmod:.*invalid module format" <<< "$OUTPUT"; then
            echo "ERROR: Expected insmod 'invalid module format' error" >&2
            exit 1
          fi

          echo "=== Test 3: real kernel module load ==="
          MOD_REL=""
          MOD_NAME=""
          for candidate in dummy ifb nlmon crc-itu-t crc7 cast-common twofish-common; do
            proc_name="${candidate//-/_}"
            if grep -q "^${proc_name} " /proc/modules; then
              continue
            fi
            match=$(awk -v c="$candidate" '
              NF == 1 && sub(/:$/, "", $1) {
                f = $1
                sub(/^.*\//, "", f)
                if (f == c ".ko" || f == c ".ko.zst" || f == c ".ko.xz" || f == c ".ko.gz") {
                  print $1
                  exit
                }
              }
            ' "/lib/modules/$(uname -r)/modules.dep" 2>/dev/null || true)
            if [ -n "$match" ]; then
              MOD_REL="$match"
              MOD_NAME="$proc_name"
              break
            fi
          done

          if [ -z "$MOD_REL" ]; then
            echo "ERROR: Could not find a harmless unloaded zero-dependency module in /lib/modules/$(uname -r)/modules.dep" >&2
            exit 1
          fi

          MOD_SRC="/lib/modules/$(uname -r)/${MOD_REL}"
          echo "Using runner module: ${MOD_SRC} (${MOD_NAME})"
          case "$MOD_SRC" in
            *.ko.zst) zstd -d -c "$MOD_SRC" > "${TEST_DIR}/tun.ko" ;;
            *.ko.xz)  xz -d -c "$MOD_SRC" > "${TEST_DIR}/tun.ko" ;;
            *.ko.gz)  gzip -d -c "$MOD_SRC" > "${TEST_DIR}/tun.ko" ;;
            *.ko)     cp "$MOD_SRC" "${TEST_DIR}/tun.ko" ;;
            *)
              echo "ERROR: Unsupported module format: ${MOD_SRC}" >&2
              exit 1
              ;;
          esac

          docker run --rm --cap-add CAP_SYS_MODULE --network none \
            -v "${TEST_DIR}:/lib/modules:ro" \
            synology-tun:test
          LOADED_MOD="$MOD_NAME"

          if ! grep -q "^${MOD_NAME} " /proc/modules; then
            echo "ERROR: Module '${MOD_NAME}' not found in /proc/modules after insmod" >&2
            exit 1
          fi
          echo "Verified '${MOD_NAME}' loaded into /proc/modules"
          sudo rmmod "$MOD_NAME"
          LOADED_MOD=""

          echo "=== Test 4: already-loaded short-circuit (PROC_MODULES) ==="
          printf 'ext4 786432 1 - Live 0xffffffffc0456000\ntun 57344 0 - Live 0xffffffffc0123000\n' > "${FIXTURE_DIR}/loaded"
          OUTPUT=$(docker run --rm --network none \
            -e PROC_MODULES=/fixtures/loaded \
            -v "${FIXTURE_DIR}:/fixtures:ro" \
            -v "${EMPTY_MODS_DIR}:/lib/modules:ro" \
            synology-tun:test 2>&1)
          echo "4a output: ${OUTPUT}"
          if ! grep -q '^tun ' <<< "$OUTPUT"; then
            echo "ERROR: Expected matching 'tun ' line in output" >&2
            exit 1
          fi

          printf 'tunnel4 16384 0 - Live 0xffffffffc0123000\n' > "${FIXTURE_DIR}/prefix_mismatch"
          set +e
          OUTPUT=$(docker run --rm --network none \
            -e PROC_MODULES=/fixtures/prefix_mismatch \
            -v "${FIXTURE_DIR}:/fixtures:ro" \
            -v "${EMPTY_MODS_DIR}:/lib/modules:ro" \
            synology-tun:test 2>&1)
          STATUS=$?
          set -e
          echo "4b exit status: ${STATUS}"
          echo "4b output: ${OUTPUT}"
          if [ "$STATUS" -eq 0 ]; then
            echo "ERROR: Expected non-zero exit status when only 'tunnel4' is present" >&2
            exit 1
          fi
          if ! grep -qi "insmod:.*No such file or directory" <<< "$OUTPUT"; then
            echo "ERROR: Expected insmod 'No such file or directory' error on prefix mismatch" >&2
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ env.IMAGE_NAME }}
            docker.io/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.base.name=${{ env.BASE_IMAGE_REPO }}:${{ env.BASE_IMAGE_TAG }}
            org.opencontainers.image.base.digest=${{ needs.check.outputs.base_digest }}
          annotations: ${{ github.event_name != 'pull_request' && format('index:org.opencontainers.image.source=https://github.com/{0}', github.repository) || '' }}
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE_REPO }}@${{ needs.check.outputs.base_digest }}
